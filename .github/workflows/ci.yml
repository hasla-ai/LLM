name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Dockerized Pytest Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for fast caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t llm-lab .

      # Step 4: Run Pytest in Docker Container
      - name: Run Pytest Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker run --rm -e OPENAI_API_KEY=$OPENAI_API_KEY llm-lab