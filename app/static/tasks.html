<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge H2 — 작업 보드</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f5f2;color:#302a26}.wrap{max-width:1100px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#a6533d}.toolbar{display:flex;gap:8px;margin:22px 0}.toolbar input{padding:10px;border:1px solid #d8d0c8;border-radius:8px}.toolbar button,.task button{border:0;border-radius:8px;background:#cf6749;color:#fff;padding:9px 12px;font-weight:700;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.column{background:#eeeae5;border-radius:14px;padding:13px;min-height:300px}.column h2{font-size:14px;margin:0 0 12px}.task{background:#fff;border-radius:11px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #38291d0d}.task small{color:#887f77}.task p{font-size:13px;line-height:1.5}.task-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.task button{font-size:11px;padding:6px 8px;background:#6d756e}.empty{color:#978d84;font-size:13px}@media(max-width:750px){.board{grid-template-columns:1fr 1fr}}@media(max-width:500px){.board{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>Forge H2 작업 보드</h1><a href="/map">← 공간 지도</a></div><p>지도 위 요소가 어떤 전문 설계 작업으로 변환되었는지 확인하고 진행상태를 기록합니다.</p><div class="toolbar"><input id="project" value="default" aria-label="프로젝트 ID"><button id="load">작업계획 불러오기</button></div><div id="board" class="board"><div class="column"><h2>자료 필요</h2><div class="empty">불러오는 중…</div></div></div></div><script>const board=document.querySelector('#board');const labels={};labels['needs-data']='자료 필요';labels.review='검토 진행';labels.approval='승인 대기';labels.done='완료';async function setStatus(project_id,task_id,status){await fetch('/api/geo/task-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id,task_id,status})});load()}async function load(){const project_id=document.querySelector('#project').value||'default';const graph=await fetch('/api/geo/graph?project_id='+encodeURIComponent(project_id)).then(r=>r.json());if(!graph.nodes.length){board.innerHTML='<div class="column"><h2>자료 필요</h2><div class="empty">먼저 지도에서 설비를 배치하세요.</div></div>';return}const plan=await fetch('/api/geo/workplan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id,nodes:graph.nodes,edges:graph.edges})}).then(r=>r.json());const statuses=['needs-data','review','approval','done'];const groups=Object.fromEntries(statuses.map(s=>[s,[]]));plan.tasks.forEach(t=>(groups[t.status]||groups['needs-data']).push(t));board.innerHTML=statuses.map(status=>'<div class="column"><h2>'+labels[status]+'</h2>'+(groups[status].length?groups[status].map(t=>'<article class="task"><b>'+t.id+' · '+t.domain+'</b><p>'+t.question+'</p><small>산출물: '+t.deliverable+'</small><div class="task-actions">'+(status==='needs-data'?'<button data-id="'+t.id+'" data-status="review">검토 시작</button>':'')+(status==='review'?'<button data-id="'+t.id+'" data-status="approval">승인 대기</button>':'')+(status==='approval'?'<button data-id="'+t.id+'" data-status="done">완료</button>':'')+'</div></article>').join(''):'<div class="empty">—</div>')+'</div>').join('');board.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>setStatus(project_id,b.dataset.id,b.dataset.status))}document.querySelector('#load').onclick=load;load();</script></body></html>
