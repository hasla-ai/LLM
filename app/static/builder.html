<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge H2 Visual Builder</title>
<style>
:root{font-family:system-ui,sans-serif;color:#302a26;background:#f7f5f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:20px;font-weight:700}.brand span{color:#cf6749}.top a{color:#a6533d}.layout{display:grid;grid-template-columns:230px 1fr 270px;gap:16px}.panel{background:#fff;border:1px solid #e2dbd4;border-radius:16px;padding:16px}.panel h2{font-size:14px;margin:0 0 12px}.hint{font-size:12px;color:#8b8178;line-height:1.5}.palette{display:grid;gap:9px}.palette button{border:1px solid #ded4cb;background:#fffaf7;border-radius:11px;padding:12px;text-align:left;font:inherit;cursor:grab}.canvas{min-height:570px;background:#fbfaf8;border:1px dashed #cfc3b9;border-radius:16px;padding:18px}.canvas.empty:after{content:'블록을 이곳에 배치하세요';display:block;text-align:center;margin-top:250px;color:#aaa096}.block{position:relative;background:#fff;border:1px solid #ded4cb;border-left:5px solid #cf6749;border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 5px 12px #4a33220d}.block h3{font-size:14px;margin:0 0 9px}.block input,.block select{width:100%;padding:8px;margin-top:6px;border:1px solid #ddd3ca;border-radius:7px;font:inherit}.remove{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#a49a91;cursor:pointer}.run{width:100%;border:0;border-radius:10px;padding:12px;background:#cf6749;color:#fff;font-weight:700;cursor:pointer}.metric{padding:10px 0;border-bottom:1px solid #eee8e2}.metric b{display:block;color:#a6533d;font-size:18px}.json{font-size:11px;white-space:pre-wrap;overflow:auto;max-height:230px;background:#f5f1ed;border-radius:8px;padding:10px;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr 1fr}.result-panel{grid-column:1/-1}}@media(max-width:600px){.layout{grid-template-columns:1fr}.result-panel{grid-column:auto}}
</style>
</head>
<body><div class="shell">
<div class="top"><div class="brand"><span>✦</span> Forge H2 · Visual Builder</div><a href="/mvp">숫자 입력 방식으로 전환</a></div>
<div class="layout">
<section class="panel"><h2>설계 블록</h2><p class="hint">블록을 클릭하거나 캔버스로 끌어다 놓으세요. 내부에서는 동일한 JSON 그래프로 변환됩니다.</p><div class="palette"><button draggable="true" data-type="site">📍 설치 부지</button><button draggable="true" data-type="demand">⚡ 전력 수요</button><button draggable="true" data-type="hydrogen">🧪 수소 공급</button><button draggable="true" data-type="generation">🔋 발전 방식</button><button draggable="true" data-type="storage">🛢 저장 조건</button></div></section>
<section id="canvas" class="canvas empty" aria-label="수소발전 설계 블록 캔버스"></section>
<section class="panel result-panel"><h2>검토 결과</h2><button id="run" class="run">구조화 데이터 분석</button><div id="result"><p class="hint">필수 블록을 배치한 뒤 분석하세요.</p></div></section>
</div></div>
<script>
const canvas=document.querySelector('#canvas'),result=document.querySelector('#result');let blocks=[];
const specs={site:{icon:'📍',title:'설치 부지',fields:[['location','지역 또는 좌표','text','']]},demand:{icon:'⚡',title:'전력 수요',fields:[['power_mw','발전 용량 MW','number','10'],['annual_hours','연간 운전시간','number','4000']]},hydrogen:{icon:'🧪',title:'수소 공급',fields:[['hydrogen_source','공급 방식','text','배관 공급']]},generation:{icon:'🔋',title:'발전 방식',fields:[['plant_type','방식','select','fuel-cell'],['electrical_efficiency','발전 효율','number','0.50']]},storage:{icon:'🛢',title:'저장 조건',fields:[['storage_days','자립일수','number','1'],['storage_density_kg_m3','저장 밀도 kg/m³','number','30'],['power_block_area_m2_per_mw','전력블록 면적 m²/MW','number','900'],['site_utilization','부지 이용률','number','0.35']]}};
function add(type){blocks.push({id:crypto.randomUUID(),type});render()}
function render(){canvas.classList.toggle('empty',!blocks.length);canvas.innerHTML='';blocks.forEach(b=>{const s=specs[b.type],el=document.createElement('div');el.className='block';el.dataset.id=b.id;el.innerHTML='<button class="remove" aria-label="블록 삭제">×</button><h3>'+s.icon+' '+s.title+'</h3>'+s.fields.map(f=>f[0]==='plant_type'?'<label>'+f[1]+'<select data-key="'+f[0]+'"><option value="fuel-cell">연료전지</option><option value="hydrogen-turbine">수소터빈</option><option value="hybrid">혼합형</option></select></label>':'<label>'+f[1]+'<input data-key="'+f[0]+'" type="'+f[2]+'" value="'+f[3]+'"></label>').join('');el.querySelector('.remove').onclick=()=>{blocks=blocks.filter(x=>x.id!==b.id);render()};canvas.append(el)})}
document.querySelectorAll('.palette button').forEach(b=>{b.onclick=()=>add(b.dataset.type);b.ondragstart=e=>e.dataTransfer.setData('type',b.dataset.type)});canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('type');if(t)add(t)};
document.querySelector('#run').onclick=async()=>{const payload={blocks:blocks.map(b=>{const el=document.querySelector('[data-id="'+b.id+'"]');const values={};el.querySelectorAll('[data-key]').forEach(x=>values[x.dataset.key]=x.value);return{type:b.type,values}})};const r=await fetch('/api/builder/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok){result.innerHTML='<p class="hint">필수 블록이 없습니다: '+d.missing.join(', ')+'</p>';return}const m=d.result.derived;result.innerHTML='<div class="metric"><b>'+m.screening_gross_area_ha+' ha</b>예비 총부지</div><div class="metric"><b>'+m.hydrogen_kg_per_hour.toLocaleString()+' kg/h</b>시간당 수소</div><div class="metric"><b>'+m.storage_inventory_kg.toLocaleString()+' kg</b>저장재고</div><pre class="json">'+JSON.stringify(d.normalized,null,2)+'</pre>'};
</script></body></html>
