<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge H2 — 예비 검토</title><style>body{font-family:system-ui,sans-serif;background:#faf9f7;color:#302a26;margin:0}.wrap{max-width:1000px;margin:auto;padding:40px 22px}a{color:#b65339}h1{margin:12px 0 6px}.sub{color:#827a73}.card,form{background:#fff;border:1px solid #e3dcd5;border-radius:16px;padding:22px;margin-top:22px;box-shadow:0 4px 18px #0000000a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #d8d0c8;border-radius:9px;font:inherit}button{margin-top:18px;background:#cf6749;border:0;color:#fff;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.secondary{background:#6e746a;margin-left:8px}.metric{display:inline-block;background:#f3ebe5;border-radius:12px;padding:12px 15px;margin:5px}.metric b{display:block;font-size:20px;color:#a8543d}.item{padding:11px 0;border-bottom:1px solid #eee8e2}.item:last-child{border:0}.warning{background:#fff5dd;color:#795f28;padding:13px;border-radius:10px;margin-top:14px;font-size:13px;white-space:pre-wrap}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.secondary{margin-left:0}}</style></head><body><div class="wrap"><a href="/">← Forge AI</a><h1>Forge H2 예비 검토</h1><p class="sub">전력수요·수소공급·운전조건으로 1차 수소발전 부지와 설계 작업을 산정합니다.</p><form id="form"><div class="grid"><div><label>설치 지역 또는 좌표</label><input name="location" placeholder="예: 전라남도 ○○군 / 위도, 경도" required></div><div><label>발전 용량 (MW)</label><input name="power_mw" type="number" step="0.1" min="0.1" value="10" required></div><div><label>연간 운전시간</label><input name="annual_hours" type="number" min="1" max="8760" value="4000" required></div><div><label>수소 공급 방식</label><select name="hydrogen_source"><option>배관 공급</option><option>튜브트레일러</option><option>액화수소</option><option>현장 전해</option></select></div><div><label>발전 방식</label><select name="plant_type"><option value="fuel-cell">연료전지</option><option value="hydrogen-turbine">수소터빈</option><option value="hybrid">혼합형</option></select></div><div><label>발전 효율 (예비값)</label><input name="electrical_efficiency" type="number" step="0.01" min="0.05" max="0.9" value="0.50" required></div><div><label>수소 저장 자립일수</label><input name="storage_days" type="number" step="0.1" min="0.1" max="30" value="1" required></div><div><label>저장 밀도 (kg/m³, 공급사값)</label><input name="storage_density_kg_m3" type="number" step="1" min="1" value="30" required></div><div><label>전력블록 면적 (m²/MW)</label><input name="power_block_area_m2_per_mw" type="number" step="10" min="1" value="900" required></div><div><label>부지 이용률</label><input name="site_utilization" type="number" step="0.01" min="0.05" max="0.9" value="0.35" required></div></div><button>예비 검토 생성</button><button type="button" class="secondary" id="report">설계 문서 다운로드</button></form><section id="result" class="hidden"><div class="card" id="summary"></div><div class="card"><h2>면적 공식</h2><pre id="formula"></pre><div id="warning" class="warning"></div></div><div class="card"><h2>작업 패키지</h2><div id="work"></div></div><div class="card"><h2>추가 자료</h2><div id="docs"></div></div></section></div><script>const form=document.querySelector('#form'),result=document.querySelector('#result');function input(){const d=Object.fromEntries(new FormData(form));for(const k of ['power_mw','annual_hours','electrical_efficiency','storage_days','storage_density_kg_m3','power_block_area_m2_per_mw','site_utilization'])d[k]=Number(d[k]);return d}async function analyze(){const r=await fetch('/api/mvp/feasibility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input())});const d=await r.json();const m=d.derived;document.querySelector('#summary').innerHTML='<h2>예비 검토 결과</h2><div class="metric"><b>'+m.annual_generation_mwh.toLocaleString()+'</b>MWh/년</div><div class="metric"><b>'+m.hydrogen_kg_per_hour.toLocaleString()+'</b>kg H₂/h</div><div class="metric"><b>'+m.storage_inventory_kg.toLocaleString()+'</b>kg 저장</div><div class="metric"><b>'+m.screening_gross_area_ha+'</b>ha 예비부지</div><p>설비 이용률: '+(m.capacity_factor*100).toFixed(1)+'% · 저장 체적: '+m.storage_volume_m3.toLocaleString()+'m³</p><div class="warning">'+d.disclaimer+'</div>';document.querySelector('#formula').textContent=d.area_model.formula+'\n\n'+d.area_model.hydrogen_formula;document.querySelector('#warning').textContent=d.area_model.warning;document.querySelector('#work').innerHTML=d.work_packages.map(x=>'<div class="item"><b>'+x.title+'</b><br><small>'+x.owners.join(', ')+' · 자료 필요</small></div>').join('');document.querySelector('#docs').innerHTML=d.required_documents.map(x=>'<div class="item">'+x+'</div>').join('');result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth'});return d}form.onsubmit=e=>{e.preventDefault();analyze()};document.querySelector('#report').onclick=async()=>{const r=await fetch('/api/mvp/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input())});const d=await r.json();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.content],{type:'text/markdown;charset=utf-8'}));a.download=d.filename;a.click();URL.revokeObjectURL(a.href)};</script></body></html>
